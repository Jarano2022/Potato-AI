services:
  potato-voice-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: potato_voice_chat
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Tu endpoint de Hermes (por defecto tu Tailscale IP, o http://host.docker.internal:8642 si corre en el host)
      - HERMES_ENDPOINT=${HERMES_ENDPOINT:-http://100.94.150.43:8642/v1/chat/completions}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    extra_hosts:
      # Permite al contenedor comunicarse con Hermes Agent o servicios del host (ej. http://host.docker.internal:8642)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

